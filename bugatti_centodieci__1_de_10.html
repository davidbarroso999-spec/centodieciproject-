<style>
:root{--bg:#0a0a0b;--txt:#e8e6e1;--dim:#8a8a90;--neon:#57e6ff;--neon2:#ff4fd8}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:auto}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif;overflow-x:hidden}
#stage{position:fixed;inset:0;z-index:0;display:block}
#vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:
 radial-gradient(ellipse 55% 40% at 50% 58%,rgba(87,230,255,.05),transparent 65%),
 radial-gradient(ellipse 40% 35% at 50% 60%,rgba(255,79,216,.028),transparent 70%),
 radial-gradient(ellipse 120% 90% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}
#loader{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:1.6rem;transition:opacity .8s}
#loader .eb{width:56px;height:56px;border:1px solid rgba(232,230,225,.25);border-radius:50%;
 display:flex;align-items:center;justify-content:center;font-weight:900}
#loader .bar{width:220px;height:1px;background:rgba(232,230,225,.15);overflow:hidden}
#loader .bar i{display:block;height:100%;width:0;background:var(--neon)}
#loader p{font-size:.62rem;letter-spacing:.5em;color:var(--dim);text-transform:uppercase}
nav{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;
 align-items:center;padding:1.4rem 3rem;mix-blend-mode:difference}
nav .logo{font-weight:800;letter-spacing:.45em;font-size:.8rem}
nav ul{display:flex;gap:2.2rem;list-style:none;font-size:.7rem;letter-spacing:.25em}
nav a{color:var(--txt);text-decoration:none;opacity:.65;transition:opacity .3s}
nav a:hover{opacity:1;color:var(--neon)}
main{position:relative;z-index:5}
.panel{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:0 8vw;pointer-events:none}
.panel>*{pointer-events:auto}
.right{align-items:flex-end;text-align:right}
.center{align-items:center;text-align:center}
.kicker{font-size:.72rem;letter-spacing:.6em;color:var(--dim);margin-bottom:1.4rem;text-transform:uppercase}
h1{font-size:clamp(3rem,10vw,9rem);font-weight:900;line-height:.92;letter-spacing:-.02em;mix-blend-mode:difference}
h1 span{display:inline-block}
h2{font-size:clamp(2rem,5.5vw,4.6rem);font-weight:800;line-height:1;mix-blend-mode:difference}
.sub{max-width:36ch;color:var(--dim);font-size:1rem;line-height:1.7;margin-top:1.8rem}
.right .sub{margin-left:auto}
.hint{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);z-index:10;
 font-size:.65rem;letter-spacing:.35em;color:var(--dim);text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(2,minmax(200px,1fr));gap:4rem 6rem;margin-top:3rem}
.stat b{font-size:clamp(2.2rem,5vw,4.2rem);font-weight:900;display:block}
.stat b em{font-style:normal;color:var(--neon)}
.stat span{font-size:.68rem;letter-spacing:.3em;color:var(--dim);text-transform:uppercase}
.reveal{opacity:0}
footer{padding:4rem 8rem;font-size:.65rem;letter-spacing:.3em;color:var(--dim);
 text-transform:uppercase;position:relative;z-index:5;text-align:center}
@media(max-width:640px){.stats{grid-template-columns:1fr;gap:2.4rem}footer{padding:3rem}}
</style>
</head>
